<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão Rápida (Manutenções) · SAKUMA</title>
<meta name="description" content="Manutenção preventiva da frota, implementos e equipamentos da SAKUMA Agronegócios: check list, horímetro e ordem de serviço com o código de estoque das peças.">
<meta name="theme-color" content="#84BD00">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-gr.v1.ico" sizes="any">
<link rel="icon" type="image/png" href="icons/gr-192.v1.png">
<link rel="apple-touch-icon" href="icons/gr-180.v1.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestão Rápida">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============================================================
     TOPO — mesmo padrão do Gestão Rápida (Pessoas).
     Duas marcas, dois papéis: a SAKUMA é a dona da operação e fica
     no alto, ao lado do nome do sistema, como o arquivo veio.
     A LOP assina como desenvolvedora, gravada a laser, só no rodapé —
     as duas marcas nunca no mesmo lugar.
     O nome do app é um botão: volta para o início, como o logotipo
     de um site.
     ============================================================ -->
<header class="topo">
  <div class="topo-int">
    <button type="button" class="topo-inicio" id="btn-inicio" title="Voltar ao início">
      <img src="icons/gr-192.v1.png" alt="">
      <h1>Gestão Rápida <span class="modulo">Manutenções</span></h1>
    </button>
    <span class="topo-divisor"></span>
    <img class="topo-marca" src="img/sakuma-logo.png" alt="SAKUMA Agronegócios">
    <span class="cresce"></span>
    <span id="lbl-local" class="local"></span>
    <div class="estado" id="estado-conexao">
      <span class="ponto" id="ponto-conexao"></span>
      <span id="txt-conexao">verificando…</span>
      <button type="button" id="btn-fila" class="fila oculto">0 aguardando envio</button>
    </div>
    <button type="button" id="btn-instalar" class="btn-fantasma oculto">Instalar o app</button>
    <button type="button" id="btn-sair" class="btn-fantasma oculto">Sair</button>
  </div>

  <!-- Duas faixas, como no Gestão Rápida (Pessoas): módulos em cima, telas do
       módulo aberto embaixo. Quem monta as duas é o js/acesso.js, a partir do
       que a pessoa tem liberado. -->
  <nav class="menu" id="menu" hidden></nav>
  <nav class="menu2" id="menu2" hidden></nav>
</header>

<main id="tela" class="conteudo">
  <section class="carregando">
    <p>Abrindo a base local…</p>
  </section>
</main>

<footer class="rodape">
  <img class="rodape-lop" src="img/lop-assinatura-laser-escuro.png"
       alt="Desenvolvido por LOP — Inteligência para o agronegócio">
</footer>

<div id="modal" class="modal oculto" role="dialog" aria-modal="true">
  <div class="caixa">
    <header><h2 id="modal-titulo"></h2>
      <button type="button" id="modal-fechar" aria-label="Fechar">×</button>
    </header>
    <div id="modal-corpo"></div>
  </div>
</div>

<div id="aviso" class="aviso oculto" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/base.js"></script>
<script src="js/telas.js"></script>
<script src="js/acesso.js"></script>
<script src="js/os.js"></script>
<script src="js/horimetro.js"></script>
<script src="js/checklist.js"></script>
</body>
</html>
